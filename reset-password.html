<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password | Three Baby Birdies</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.rp-page { min-height:78vh; display:flex; align-items:center; justify-content:center; padding:calc(var(--nav-h) + 44px) var(--sp-md) 60px; }
.rp-card { background:#fff; border-radius:var(--r-lg); box-shadow:var(--sh-md); padding:34px 30px; max-width:420px; width:100%; }
.rp-bird { width:66px; margin:0 auto 16px; display:block; }
.rp-card h1 { font-size:1.4rem; text-align:center; margin-bottom:8px; }
.rp-sub { font-size:.9rem; color:var(--mid); text-align:center; margin-bottom:22px; }
.rp-group { display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
.rp-label { font-family:var(--font-display); font-weight:700; font-size:.82rem; color:var(--mid); }
.rp-input {
  padding:14px 16px; border-radius:var(--r-md); border:2px solid var(--cream-dark);
  background:var(--cream); font-family:var(--font-body); font-size:1rem; color:var(--dark); outline:none;
}
.rp-input:focus { border-color:var(--sky-dark); background:#fff; }
.rp-input[aria-invalid="true"] { border-color:var(--red); }
.rp-hint { font-size:.76rem; color:var(--light-text); }
.rp-msg { font-family:var(--font-display); font-weight:700; font-size:.85rem; border-radius:var(--r-md); padding:12px 14px; margin-bottom:16px; }
.rp-msg.err { background:#FBECEA; color:var(--red); }
.rp-msg.ok  { background:var(--green-light); color:var(--green); }
.rp-msg[hidden] { display:none; }
</style>
<!-- SEO / social / icons -->
<meta name="description" content="Choose a new password for your Three Baby Birdies account.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#6EB4D4">
<!-- /SEO -->
</head>
<body>

<nav id="nav"></nav>
<div id="mob-menu"></div>

<main class="rp-page">
  <div class="rp-card">
    <img src="assets/chirpy.png" alt="" class="mascot rp-bird" width="280" height="276" decoding="async">
    <h1>Choose a new password</h1>
    <p class="rp-sub" id="rp-sub">Pick something you&rsquo;ll remember. It needs at least 8 characters.</p>

    <p class="rp-msg" id="rp-msg" role="status" aria-live="polite" hidden></p>

    <div id="rp-form">
      <div class="rp-group">
        <label class="rp-label" for="rp-pass">New password</label>
        <input class="rp-input" id="rp-pass" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      </div>
      <div class="rp-group">
        <label class="rp-label" for="rp-pass2">Type it again</label>
        <input class="rp-input" id="rp-pass2" type="password" autocomplete="new-password" placeholder="The same password">
        <span class="rp-hint">Both boxes need to match.</span>
      </div>
      <button class="btn btn-red" id="rp-save" type="button" style="width:100%;justify-content:center;">Save the new password</button>
    </div>

    <p style="text-align:center;margin-top:18px;font-size:.84rem;">
      <a href="login.html" style="color:var(--sky-dark);text-decoration:underline;">Back to sign in</a>
    </p>
  </div>
</main>

<footer id="footer"></footer>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://api.threebabybirdies.com';

  var msg  = document.getElementById('rp-msg');
  var form = document.getElementById('rp-form');
  var sub  = document.getElementById('rp-sub');
  var save = document.getElementById('rp-save');
  var p1   = document.getElementById('rp-pass');
  var p2   = document.getElementById('rp-pass2');

  function tell(text, kind) {
    msg.textContent = text;
    msg.className = 'rp-msg ' + kind;
    msg.hidden = false;
  }

  var token = new URLSearchParams(location.search).get('token') || '';
  if (!token) {
    // Arriving here without a token means a mangled link, not an expired one.
    form.hidden = true;
    sub.hidden = true;
    tell('That link is missing its code. Request a new one from the sign-in page.', 'err');
    return;
  }

  save.addEventListener('click', async function () {
    p1.removeAttribute('aria-invalid'); p2.removeAttribute('aria-invalid');

    if (p1.value.length < 8) {
      p1.setAttribute('aria-invalid', 'true'); p1.focus();
      tell('Please use at least 8 characters.', 'err'); return;
    }
    if (p1.value !== p2.value) {
      p2.setAttribute('aria-invalid', 'true'); p2.focus();
      tell('Those two passwords are not the same.', 'err'); return;
    }

    save.disabled = true;
    tell('Saving…', 'ok');
    try {
      var res = await fetch(API + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: p1.value })
      });
      var data = await res.json().catch(function () { return {}; });

      if (res.ok) {
        form.hidden = true; sub.hidden = true;
        tell('Done. Your password has been changed, you can sign in with it now.', 'ok');
        setTimeout(function () { location.href = 'login.html'; }, 2200);
        return;
      }
      if (res.status === 429) {
        tell('That is a few tries in a row. Wait a little and try again.', 'err');
      } else {
        tell(data.detail || 'That reset link is invalid or has expired. Please request a new one.', 'err');
      }
    } catch (e) {
      tell('We could not reach the server. Check your connection and try again.', 'err');
    }
    save.disabled = false;
  });
})();
</script>
</body></html>
